kind = "web"
previewPath = "/"
title = "CBDC Clearing Engine"
version = "1.0.0"
id = "artifacts/cbdc-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18812

[services.development]
run = "pnpm --filter @workspace/cbdc-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cbdc-dashboard", "run", "build" ]
publicDir = "artifacts/cbdc-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18812"
BASE_PATH = "/"
